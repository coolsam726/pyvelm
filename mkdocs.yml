site_name: PyVELM
site_description: Odoo semantics, Laravel ergonomics, Filament craft — a Tailwind-native Python ERP shell built only for PyVELM.
site_url: https://coolsam726.github.io/pyvelm/
repo_url: https://github.com/coolsam726/pyvelm
edit_uri: edit/main/docs/

# All prose lives under docs/ already; mkdocstrings stubs land in
# docs/api/. site/ is the build output and is in .gitignore.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.share
  palette:
    # Light mode default; toggles to dark via the icon in the header.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
extra_css:
  - assets/css/savannabits.css
extra:
  version:
    provider: mike
    alias: true
  social:
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/coolsam726
      name: Sponsor on GitHub

plugins:
  - search
  - glightbox
  - mike:
      version_selector: true
      css_dir: assets
      javascript_dir: assets
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]            # so `pyvelm.X` imports resolve from repo root
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]    # hide dunder/private by default

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

