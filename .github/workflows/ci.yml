# Unit tests + coverage on every push/PR to main.
# Integration tests use PYVELM_DSN_TEST (never PYVELM_DSN).
# Tests bootstrap their own schema (reset + install_modules) — no pyvelm migrate step.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pyvelm
          POSTGRES_PASSWORD: pyvelm
          POSTGRES_DB: pyvelm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyvelm -d pyvelm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYVELM_DSN_TEST: postgresql://pyvelm:pyvelm@localhost:5432/pyvelm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,geo]"

      - name: Create Postgres test database
        run: PGPASSWORD=pyvelm psql -h localhost -U pyvelm -d pyvelm -c "CREATE DATABASE pyvelm_test;"

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=pyvelm \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          slug: coolsam726/pyvelm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  test-sqlite:
    runs-on: ubuntu-latest

    env:
      PYVELM_DSN_TEST: sqlite:////tmp/pyvelm-ci-test.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,geo]"

      - name: Run database portability tests
        run: pytest pyvelm/tests/test_database.py pyvelm/tests/test_database_routing.py -q

  test-mariadb:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: pyvelm
          MARIADB_DATABASE: pyvelm_test
          MARIADB_USER: pyvelm
          MARIADB_PASSWORD: pyvelm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PYVELM_DSN_TEST: mysql+pymysql://pyvelm:pyvelm@127.0.0.1:3306/pyvelm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,geo]"

      - name: Run MariaDB portability tests
        run: |
          pytest pyvelm/tests/test_database.py pyvelm/tests/test_database_routing.py \
            pyvelm/tests/test_http_smoke.py -q

  test-mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pyvelm
          MYSQL_DATABASE: pyvelm_test
          MYSQL_USER: pyvelm
          MYSQL_PASSWORD: pyvelm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -upyvelm -ppyvelm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PYVELM_DSN_TEST: mysql+pymysql://pyvelm:pyvelm@127.0.0.1:3306/pyvelm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,geo]"

      - name: Run MySQL portability tests
        run: |
          pytest pyvelm/tests/test_database.py pyvelm/tests/test_database_routing.py \
            pyvelm/tests/test_http_smoke.py -q

  # MCR (mcr.microsoft.com) intermittently returns "The request is blocked" for
  # GitHub-hosted runner IPs — see microsoft/mssql-docker#964. We avoid the
  # services: pull (no retries) by loading a cached image tar or pulling with
  # backoff; continue-on-error keeps PRs green when MCR is down for the runner.
  test-mssql:
    runs-on: ubuntu-22.04
    continue-on-error: true

    env:
      MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
      MSSQL_SA_PASSWORD: Pyvelm123!
      PYVELM_DSN_TEST: "mssql+pyodbc://sa:Pyvelm123!@127.0.0.1:1433/pyvelm_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"

    steps:
      - uses: actions/checkout@v4

      - name: Restore MSSQL image cache
        uses: actions/cache@v4
        id: mssql-image-cache
        with:
          path: /tmp/mssql-image.tar
          key: mssql-image-2022-CU14-ubuntu-22.04-v1

      - name: Pull or load SQL Server image
        run: |
          set -euo pipefail
          if [ -f /tmp/mssql-image.tar ]; then
            echo "Loading SQL Server image from Actions cache…"
            docker load -i /tmp/mssql-image.tar
            exit 0
          fi
          pulled=0
          for attempt in $(seq 1 10); do
            echo "Pull attempt ${attempt}/10: ${MSSQL_IMAGE}"
            if docker pull "${MSSQL_IMAGE}"; then
              pulled=1
              break
            fi
            sleep $((attempt * 6))
          done
          if [ "${pulled}" != 1 ]; then
            echo "::error::MCR blocked or unreachable for this runner (microsoft/mssql-docker#964). Re-run the workflow or wait for cache from a successful run."
            exit 1
          fi
          docker save -o /tmp/mssql-image.tar "${MSSQL_IMAGE}"

      - name: Start SQL Server container
        run: |
          set -euo pipefail
          docker rm -f mssql-ci 2>/dev/null || true
          docker run -d --name mssql-ci \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}" \
            -p 1433:1433 \
            "${MSSQL_IMAGE}"
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec mssql-ci /opt/mssql-tools18/bin/sqlcmd \
              -C -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -Q "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "SQL Server not ready yet (${attempt}/60)…"
            sleep 5
          done
          if [ "${ready}" != 1 ]; then
            echo "::error::SQL Server container failed to become ready."
            docker logs mssql-ci || true
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,geo,mssql]"

      - name: Create SQL Server test database
        run: |
          python <<'PY'
          from sqlalchemy import create_engine, text
          url = "mssql+pyodbc://sa:Pyvelm123!@127.0.0.1:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          engine = create_engine(url, isolation_level="AUTOCOMMIT")
          with engine.connect() as conn:
              conn.execute(text(
                  "IF DB_ID('pyvelm_test') IS NULL CREATE DATABASE pyvelm_test"
              ))
          engine.dispose()
          PY

      - name: Run MSSQL portability tests
        run: |
          pytest pyvelm/tests/test_database.py pyvelm/tests/test_database_routing.py \
            pyvelm/tests/test_http_smoke.py -q

      - name: Stop SQL Server container
        if: always()
        run: docker rm -f mssql-ci 2>/dev/null || true

  test-oracle:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:latest
        env:
          ORACLE_PASSWORD: Pyvelm123!
          APP_USER: pyvelm
          APP_USER_PASSWORD: pyvelm
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval=15s
          --health-timeout=10s
          --health-retries=20

    env:
      PYVELM_DSN_TEST: oracle+oracledb://pyvelm:pyvelm@127.0.0.1:1521/?service_name=FREEPDB1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,geo,oracle]"

      - name: Run Oracle portability tests
        run: |
          pytest pyvelm/tests/test_database.py pyvelm/tests/test_database_routing.py \
            pyvelm/tests/test_http_smoke.py -q
