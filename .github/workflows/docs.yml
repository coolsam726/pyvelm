# Build docs on PRs; publish versioned site with mike on release tags.
#
# GitHub Pages → Settings → Build and deployment → Source = "Deploy from a branch"
# → Branch `gh-pages` / `/ (root)` (mike manages version subdirs + default redirect).
#
# Local: `mkdocs build --strict` before merging; `mike deploy` after tagging (see docs/versioning.md).

name: docs

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Mike version directory (e.g. 1.0, no leading v)"
        required: true
        default: "1.0"
      update_latest:
        description: "Point the latest alias at this version"
        type: boolean
        default: true

permissions:
  contents: write
  pages: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pyvelm + docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Strict MkDocs build
        run: mkdocs build --strict

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pyvelm + docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
      - name: Deploy manual version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "${{ inputs.update_latest }}" == "true" ]]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push "$VERSION"
          fi
