{# Shared loader overlay — boot (full page) + HTMX swap (target bounds). #}
<div id="pv-swap-blocker"
     class="pv-swap-blocker"
     role="status"
     aria-live="polite"
     aria-hidden="false"
     aria-label="Loading">
    <svg class="pv-swap-blocker__spinner" fill="none" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    <p class="text-sm font-medium text-body">Loading…</p>
</div>
